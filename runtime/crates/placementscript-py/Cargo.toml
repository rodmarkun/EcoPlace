[package]
name = "placementscript-py"
description = "PyO3 bindings for placementscript-core: the native embedding used by the simulator and the Python risk gates (TODO 1.3/1.6/1.8)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "placementscript"
crate-type = ["cdylib"]

[dependencies]
placementscript-core = { path = "../placementscript-core" }
# abi3-py310: one wheel per platform, no per-interpreter builds; extension-module keeps
# libpython unlinked (also lets `cargo build/clippy` work without Python dev libs).
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"] }
