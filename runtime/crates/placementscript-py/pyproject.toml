[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "placementscript"
description = "PlacementScript DSL bindings: the single Rust interpreter (C18) for evolved placement policies."
requires-python = ">=3.10"
license = "Apache-2.0"
dynamic = ["version"]

[tool.maturin]
module-name = "placementscript"
# abi3 wheel (pyo3 abi3-py310): one wheel per platform.
