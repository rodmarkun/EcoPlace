[package]
name = "placementscript-wasm-guest"
description = "wasm32-wasip1 module: the placementscript-core interpreter + an embedded policy source, behind the postcard host-call ABI (TODO 1.4)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
placementscript-core = { path = "../placementscript-core", features = ["wire"] }
serde = { workspace = true }
postcard = { workspace = true }
