[package]
name = "placementscript-wasm-host"
description = "wasmtime host harness for the PlacementScript wasm module: fuel + memory limits, zero WASI capabilities (TODO 1.4). Prototype for the Phase-7 scheduler-plugin host."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
placementscript-core = { path = "../placementscript-core", features = ["wire"] }
postcard = { workspace = true }
serde = { workspace = true }
wasmtime = "29"
anyhow = "1"

[[bin]]
name = "ps-wasm-bench"
path = "src/bin/ps_wasm_bench.rs"
