[package]
name = "placementscript-core"
description = "PlacementScript DSL: the single interpreter (C18) for evolved placement policies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Serde-encodable mirror types for the host-call ABI (postcard) and the conformance
# suite (JSON). Kept optional so the bare interpreter stays dependency-free.
wire = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[lib]
crate-type = ["rlib"]
