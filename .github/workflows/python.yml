name: python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ruff + pytest
    # macOS arm64, the platform the studies ran on: sealed numeric registrations (energy bundles)
    # are reproduced bit for bit only there.
    runs-on: macos-latest
    steps:
      # The project depends on ShinkaEvolve as an *editable sibling checkout*
      # (pyproject [tool.uv.sources]), so check out into a subdirectory and clone the
      # sibling next to it, mirroring the local layout.
      - uses: actions/checkout@v4
        with:
          path: EvolvedContinuum

      - name: Reconstruct pinned ShinkaEvolve fork tree
        run: |
          test "$(shasum -a 256 EvolvedContinuum/evolution/shinkaevolve-patches/0001-feat-add-seeded-proposal-operator-contract.patch | cut -d' ' -f1)" = "16504dc5a0910bb6bbb8487bbe35511ecf1552728129f98b1a1148cb7d5e3a54"
          test "$(shasum -a 256 EvolvedContinuum/evolution/shinkaevolve-patches/0002-fix-require-explicit-async-patch-seed.patch | cut -d' ' -f1)" = "c4c1d0c4d90281c2bb1bcc0b3a7ce87381f0e360918bfe541760c1ac9c35a8e2"
          git clone https://github.com/rodmarkun/ShinkaEvolve.git ShinkaEvolve
          git -C ShinkaEvolve checkout --detach 4fba8f69a51a9da7970ac8cdd89de148b9696bea
          git -C ShinkaEvolve apply --index ../EvolvedContinuum/evolution/shinkaevolve-patches/0001-feat-add-seeded-proposal-operator-contract.patch
          git -C ShinkaEvolve apply --index ../EvolvedContinuum/evolution/shinkaevolve-patches/0002-fix-require-explicit-async-patch-seed.patch
          test "$(git -C ShinkaEvolve write-tree)" = "710a2feb684aa9d934039256cbfa520efaa245cd"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Rust (1.93.0) for the placementscript wheel
        uses: dtolnay/rust-toolchain@1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: EvolvedContinuum/runtime

      - name: Sync environment (core + dev; heavy extras rl/milp not needed for tests)
        working-directory: EvolvedContinuum
        run: uv sync

      - name: Build + install the placementscript wheel (PyO3 native embedding)
        working-directory: EvolvedContinuum
        run: |
          uv pip install maturin
          uv run --no-sync maturin develop --release -m runtime/crates/placementscript-py/Cargo.toml

      - name: ruff
        working-directory: EvolvedContinuum
        # Study launchers and analyses under experiments/ are hash-bound to their frozen
        # registrations and are not reformatted.
        run: uv run --no-sync ruff check sim evolution baselines analysis runtime tests scripts figures

      - name: pytest
        working-directory: EvolvedContinuum
        run: uv run --no-sync pytest

      - name: verify pinned imports
        working-directory: EvolvedContinuum
        run: uv run --no-sync python -c "import shinka, deap, hypothesis, pyarrow; print('imports ok')"
