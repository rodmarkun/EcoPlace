name: rust

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "docs/placementscript-spec.md"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "docs/placementscript-spec.md"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: runtime

jobs:
  check:
    name: fmt + clippy + test + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, wasm32-wasip1)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # wasm32-wasi was renamed upstream; wasip1 is the same WASI preview-1 target.
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: wasm32-wasip1 build (interpreter + guest module; py/host crates are native-only)
        run: cargo build -p placementscript-core -p placementscript-wasm-guest --target wasm32-wasip1

      - name: tests (workspace; wasm-consuming tests pinned to the guest built above — R1.8)
        env:
          PS_WASM_GUEST: ${{ github.workspace }}/runtime/target/wasm32-wasip1/debug/placementscript_wasm_guest.wasm
        run: cargo test --workspace
